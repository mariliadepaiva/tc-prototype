<style id="theme">

      <div class="pill round" id="moreBtn" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1C1C1E"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>

<script id="app">
(function(){
/* ---------------- state ---------------- */
const S = {
  mode: 'fn',              // 'fn' | 'num'
  def: 'fn',
  variant: 'returning',
  sheetShown: false,
  expr: [],                // token tree (root list)
  afterEq: false, lastResult: null, lastValid: 0,
  history: [], log: [], bsCount: 0, eqCount: 0,
  menuOpen: false, settings: null, // null | 'root' | 'detail'
  probe: false, first: null,       // cold-probe diagnostic state: first key kind 'fn' | 'num' | 'other'
  presel: 'fn'                     // sheet preselection (fixed, independent of mode)
};
const LABEL = {fn:'Function first', num:'Number first'};
const SUB = {fn:'Tap sin, then 90 → sin(90)', num:'Tap 90, then sin → 90 sin'};
const PREFIX = ['sin','cos','tan','sinh','cosh','tanh','ln','log₁₀','√x','∛x'];
const FNAME = {'√x':'√','∛x':'∛','log₁₀':'log₁₀'};

/* ---------------- logging ---------------- */
function log(ev, extra){
  const e = Object.assign({t: new Date().toISOString(), ev, mode: S.mode}, extra||{});
  S.log.push(e); window.__log = S.log;
  const v=document.getElementById('logView'); if(!v.hidden){ v.textContent = S.log.map(x=>JSON.stringify(x)).join('\n'); v.scrollTop=v.scrollHeight; }
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }

/* ---------------- tree helpers ---------------- */
// token: {t:'num',v} | {t:'const',v:'π'|'e'} | {t:'op',v} | {t:'imul'} | {t:'fn',name,args:[],closed} | {t:'grp',args:[],closed} | {t:'post',op,child}
function openPath(list){ // returns deepest open list
  const last = list[list.length-1];
  if(last && (last.t==='fn'||last.t==='grp') && !last.closed) return openPath(last.args);
  return list;
}
function parentOfOpen(list, parent){ // returns [parentList, openNode] for the deepest open group
  const last = list[list.length-1];
  if(last && (last.t==='fn'||last.t==='grp') && !last.closed){
    const inner = last.args[last.args.length-1];
    if(inner && (inner.t==='fn'||inner.t==='grp') && !inner.closed) return parentOfOpen(last.args, last);
    return [list, last];
  }
  return null;
}
const isTerm = tok => tok && (tok.t==='num'||tok.t==='const'||tok.t==='post'||((tok.t==='fn'||tok.t==='grp')&&tok.closed));
function hasEmptySlot(list){
  for(const tok of list){
    if(tok.t==='fn'||tok.t==='grp'){ if(!tok.args.some(x=>isTerm(x) || ((x.t==='fn'||x.t==='grp') && x.args.length))) return true; if(hasEmptySlot(tok.args)) return true; }  // an open, non-empty inner group counts as a term (as-if-closed)
    if(tok.t==='post' && hasEmptySlot([tok.child])) return true;
  }
  return false;
}
function anyOpen(list){ return list.some(tok => ((tok.t==='fn'||tok.t==='grp') && (!tok.closed || anyOpen(tok.args)))); }
function closeAll(list){ list.forEach(tok=>{ if(tok.t==='fn'||tok.t==='grp'){ tok.closed=true; closeAll(tok.args);} }); }

/* ---------------- evaluation ---------------- */
const toRad = d => d*Math.PI/180;
function fact(n){ if(n<0||Math.floor(n)!==n||n>170) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function applyFn(name,x){
  switch(name){
    case 'sin': return Math.sin(toRad(x)); case 'cos': return Math.cos(toRad(x)); case 'tan': return Math.tan(toRad(x));
    case 'sinh': return Math.sinh(x); case 'cosh': return Math.cosh(x); case 'tanh': return Math.tanh(x);
    case 'ln': return Math.log(x); case 'log₁₀': return Math.log10(x); case '√x': return Math.sqrt(x); case '∛x': return Math.cbrt(x);
  } return NaN;
}
function applyPost(op,x){
  switch(op){ case 'x²': return x*x; case 'x³': return x*x*x; case '¹⁄ₓ': return 1/x; case 'x!': return fact(x); case '%': return x/100; } return NaN;
}
function valueOf(tok){
  switch(tok.t){
    case 'num': return parseFloat(tok.v.replace(',','.')) ;
    case 'const': return tok.v==='π'?Math.PI:Math.E;
    case 'fn': return applyFn(tok.name, evalList(tok.args));
    case 'grp': return evalList(tok.args);
    case 'post': return applyPost(tok.op, valueOf(tok.child));
  } return NaN;
}
function evalList(list){ // treats open groups as closed; ignores trailing operator; returns NaN on empty
  const vals=[], ops=[]; let neg=false, expectVal=true;
  for(const tok of list){
    if(tok.t==='op'){
      if(expectVal){ if(tok.v==='−') neg=!neg; continue; }
      ops.push(tok.v); expectVal=true; continue;
    }
    if(tok.t==='imul'){ ops.push('×'); expectVal=true; continue; }
    let v = valueOf(tok); if(neg){ v=-v; neg=false; }
    vals.push(v); expectVal=false;
  }
  if(expectVal && ops.length) ops.pop(); // trailing operator
  if(!vals.length) return NaN;
  // precedence: ^ then ×÷ then +−
  const reduce = (set, fn) => { for(let i=0;i<ops.length;){ if(set.includes(ops[i])){ vals.splice(i,2,fn(ops[i],vals[i],vals[i+1])); ops.splice(i,1);} else i++; } };
  for(let i=ops.length-1;i>=0;i--){ if(ops[i]==='^'){ vals.splice(i,2,Math.pow(vals[i],vals[i+1])); ops.splice(i,1);} }
  reduce(['×','÷'], (o,a,b)=> o==='×'?a*b:a/b);
  reduce(['+','−'], (o,a,b)=> o==='+'?a+b:a-b);
  return vals[0];
}
function fmt(v){
  if(v===null||v===undefined||Number.isNaN(v)) return '–';
  if(!isFinite(v)) return 'Error';
  let s = Math.abs(v)>=1e12||(Math.abs(v)<1e-9&&v!==0) ? v.toExponential(6) : String(+v.toPrecision(12));
  s = s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  const [i,d] = s.split('.'); const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (d!==undefined ? ii+','+d : ii).replace('-','−');
}

/* ---------------- rendering (two renderers, one tree) ---------------- */
const M = s => `<span class="m">${s}</span>`;
function renderFn(list, depth){
  return list.map(tok=>{
    switch(tok.t){
      case 'num': return tok.v; case 'const': return tok.v;
      case 'op': return tok.v==='^' ? '^' : ' '+tok.v+' ';
      case 'imul': return M('×');
      case 'fn': return (FNAME[tok.name]||tok.name)+'('+renderFn(tok.args)+(tok.closed?')':M(')'));
      case 'grp': return '('+renderFn(tok.args)+(tok.closed?')':M(')'));
      case 'post': return renderFn([tok.child])+postGlyph(tok.op);
    }
  }).join('');
}
function renderNum(list){ // legacy notation
  return list.map(tok=>{
    switch(tok.t){
      case 'num': return tok.v; case 'const': return tok.v;
      case 'op': return tok.v==='^' ? '^' : ' '+tok.v+' ';
      case 'imul': return M('×');
      case 'fn': return renderNum(tok.args)+' '+(FNAME[tok.name]||tok.name);
      case 'grp': return '('+renderNum(tok.args)+(tok.closed?')':M(')'));
      case 'post': return renderNum([tok.child])+postGlyph(tok.op);
    }
  }).join('');
}
function postGlyph(op){ return {'x²':'²','x³':'³','¹⁄ₓ':'⁻¹','x!':'!','%':'%'}[op]||op; }

function liveResult(){
  if(S.afterEq) return fmt(S.lastResult);
  if(!S.expr.length) return '0';
  if(S.mode==='fn'){
    if(hasEmptySlot(S.expr)) return '–';
    const v = evalList(S.expr); if(Number.isNaN(v)) return fmt(S.lastValid);
    S.lastValid = v; return fmt(v);
  } else { // operand-only (legacy)
    const cur = openPath(S.expr); const last = cur[cur.length-1];
    if(!last) return fmt(S.lastValid);
    if(isTerm(last)){ const v=valueOf(last); S.lastValid=v; return fmt(v); }
    return fmt(S.lastValid);
  }
}

function render(list){ // probe: render in the notation the participant typed in; otherwise by mode
  const useNum = S.probe ? S.first==='num' : S.mode==='num';
  return useNum ? renderNum(list) : renderFn(list);
}
function paint(){
  const exprEl = document.getElementById('expr');
  const html = render(S.expr);
  exprEl.innerHTML = '<span>'+(S.afterEq? html : html+'<i class="cur"></i>')+'</span>';
  const resEl = document.getElementById('res'); resEl.textContent = liveResult();
  document.getElementById('pdLbl').textContent = LABEL[S.mode];
  // collapse pull-down when the result needs the width (T1)
  const pd = document.getElementById('pd'); pd.classList.remove('col'); resEl.style.fontSize='56px';
  const row = pd.closest('.row2');
  let avail = row.clientWidth - pd.closest('.badges').offsetWidth - 8;
  if(resEl.scrollWidth > avail){ pd.classList.add('col'); avail = row.clientWidth - pd.closest('.badges').offsetWidth - 8; }
  let fs=56; while(resEl.scrollWidth > avail && fs>28){ fs-=2; resEl.style.fontSize=fs+'px'; }   // result never truncates (T1)
}

/* ---------------- input rules ---------------- */
function snapshot(){ return render(S.expr).replace(/<[^>]+>/g,''); }
function asciiNum(v){ if(v===null||v===undefined||Number.isNaN(v)) return 'nan'; if(!isFinite(v)) return 'err'; return String(Math.round(v*1000)/1000); } // '.' decimal, '-' minus, 3 dp — for URL markers
function press(key){
  const before = snapshot();
  if(S.afterEq && !['=','⌫'].includes(key)){
    // start new: digits start fresh, functions/ops/postfix reuse the result (A8)
    const reuse = PREFIX.includes(key) || ['+','−','×','÷','xʸ','x²','x³','¹⁄ₓ','x!','%'].includes(key);
    S.expr = reuse ? [{t:'num', v: fmt(S.lastResult).replace(/\./g,'')}] : [];
    S.afterEq=false;
  }
  const cur = openPath(S.expr); const last = cur[cur.length-1];
  const D = /^[0-9]$/.test(key);
  if(S.probe && S.first===null){
    if(D||key===','||key==='π'||key==='e'){ S.first='num'; log('probe_first',{kind:'num',key}); mark('first=num'); }
    else if(PREFIX.includes(key)){ S.first='fn'; log('probe_first',{kind:'fn',key}); mark('first=fn'); }
  }
  if(D || key===','){
    if(last && last.t==='num'){ if(key===','){ if(!last.v.includes(',')) last.v+=','; } else last.v = (last.v==='0'&&key!=='0'&&!last.v.includes(','))? key : last.v+key; }
    else { if(isTerm(last)) cur.push({t:'imul'}); cur.push({t:'num', v: key===','?'0,':key}); }
  }
  else if(key==='π'||key==='e'){ if(isTerm(last)) cur.push({t:'imul'}); cur.push({t:'const', v:key}); }
  else if(['+','−','×','÷'].includes(key)){
    if(!last || last.t==='imul'){ if(key==='−'){ if(last&&last.t==='imul') cur.pop(); cur.push({t:'op',v:'−'}); } else toast('Enter a number first'); }
    else if(last.t==='op'){ last.v = key; }
    else cur.push({t:'op', v:key});
  }
  else if(key==='xʸ'){ if(isTerm(last)) cur.push({t:'op',v:'^'}); }
  else if(PREFIX.includes(key)){
    if(S.mode==='fn'){
      if(isTerm(last)){ cur.pop(); cur.push({t:'fn',name:key,args:[last],closed:true}); }   // wrap rule
      else cur.push({t:'fn',name:key,args:[],closed:false});                                   // insert rule
    } else { // legacy: postfix function; on empty operand the function is dropped (today's bug, kept on purpose)
      if(isTerm(last)){ cur.pop(); cur.push({t:'fn',name:key,args:[last],closed:true}); }
      else { log('legacy_function_dropped',{key}); }
    }
  }
  else if(key==='('){ if(isTerm(last)) cur.push({t:'imul'}); cur.push({t:'grp',args:[],closed:false}); }
  else if(key===')'){ const po = parentOfOpen(S.expr); if(po && po[1].args.length) po[1].closed=true; }
  else if(['x²','x³','¹⁄ₓ','x!','%'].includes(key)){ if(isTerm(last)){ cur.pop(); cur.push({t:'post',op:key,child:last}); } }
  else if(key==='⌫'){
    S.bsCount++;
    if(S.afterEq){ S.afterEq=false; S.expr=[]; }
    else if(!cur.length){ const po=parentOfOpen(S.expr); if(po){ po[0].pop(); } }   // F3: opener + soft paren go together
    else {
      const tok = cur.pop();
      if(tok.t==='num' && tok.v.length>1){ tok.v = tok.v.slice(0,-1); cur.push(tok); }
      else if(tok.t==='post'){ cur.push(tok.child); }                              // postfix removed, term stays
      else { // whole token gone (last digit, const, op, closed fn/grp = F7).
        // F6/F6b (decided 17 Sep): after a closed group, the × before the digit goes too — auto-inserted or typed
        const l2=cur[cur.length-1], l3=cur[cur.length-2];
        if(tok.t==='num'||tok.t==='const'){ if(l2 && l2.t==='imul') cur.pop(); else if(l2 && l2.t==='op' && l2.v==='×' && l3 && (l3.t==='fn'||l3.t==='grp') && l3.closed) cur.pop(); }
      }
    }
  }
  else if(key==='ac'){ S.expr=[]; S.afterEq=false; S.lastValid=0; }
  else if(key==='='){
    S.eqCount++;
    if(S.probe && S.first===null){ S.first='other'; log('probe_first',{kind:'other'}); mark('first=other'); }
    if(!S.expr.length) return;
    if(hasEmptySlot(S.expr)){ flash(); toast('Enter a number'); log('equals_refused_empty_slot',{before, n:S.eqCount}); return; }
    closeAll(S.expr);
    const v = S.mode==='fn' ? evalList(S.expr) : evalList(S.expr);
    S.lastResult = v; S.afterEq=true;
    const shown = snapshot();
    S.history.push({expr: JSON.parse(JSON.stringify(S.expr)), result: v, mode:S.mode});
    log('equals',{expr: shown, result: fmt(v), backspaces:S.bsCount, n:S.eqCount}); S.bsCount=0;
    if(!S.probe) mark('res='+asciiNum(v)+'&n='+S.eqCount);   // probe scores the order (first=), not the result
    paint(); return;
  }
  else { log('inert_key',{key}); }
  paint();
  log('key',{key, before, after: snapshot(), result: document.getElementById('res').textContent});
}
function isTermAt(list,i){ return i>=0 && isTerm(list[i]) && !(list[i].t==='num' && list[i].v===''); }
function flash(){ const e=document.getElementById('expr'); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }

/* ---------------- keypad ---------------- */
const SCI = [['(',')','mc','m+','m-','mr'],['⇧','x²','x³','xʸ','eˣ','10ˣ'],['¹⁄ₓ','√x','∛x','ʸ√x','ln','log₁₀'],['x!','sin','cos','tan','e','EE'],['Rand','sinh','cosh','tanh','π','Deg']];
const INERT = new Set(['mc','m+','m-','mr','⇧','eˣ','10ˣ','ʸ√x','EE','Rand','Deg']);
const MAIN = [[['ac','g s'],['⁺∕₋','g s'],['%','g s'],['÷','op']],[['7'],['8'],['9'],['×','op']],[['4'],['5'],['6'],['−','op']],[['1'],['2'],['3'],['+','op']],[['0'],[','],['⌫','s'],['=','op']]];
function buildKeys(){
  const k=document.getElementById('keys'); let h='';
  SCI.forEach(r=>{ h+='<div class="krow">'+r.map(x=>`<button class="k${INERT.has(x)?' i':''}" data-k="${x}" aria-label="${aria(x)}">${x}</button>`).join('')+'</div>'; });
  h+='<div class="main">'+MAIN.map(r=>'<div class="krow">'+r.map(([x,c])=>`<button class="k ${c||''}" data-k="${x}" aria-label="${aria(x)}">${x}</button>`).join('')+'</div>').join('')+'</div>';
  k.innerHTML=h;
  k.addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(!b) return; let key=b.dataset.k; if(key==='⁺∕₋'){ toggleSign(); return; } if(INERT.has(key)){ log('inert_key',{key}); return; } press(key); });
}
function aria(x){ return {sin:'sine',cos:'cosine',tan:'tangent','⌫':'delete','ac':'all clear','x²':'squared','x³':'cubed','¹⁄ₓ':'reciprocal','√x':'square root','∛x':'cube root','x!':'factorial','÷':'divide','×':'multiply','−':'minus','+':'plus','=':'equals'}[x]||x; }
function toggleSign(){ const cur=openPath(S.expr); const last=cur[cur.length-1]; if(last&&last.t==='num'){ last.v = last.v.startsWith('−')?last.v.slice(1):'−'+last.v; paint(); } }

/* ---------------- mode switching ---------------- */
function setMode(m, source){
  if(m===S.mode) return;
  const before = snapshot(); S.mode=m; paint();
  log('mode_switch',{to:m, source, before, after: snapshot()}); storeMode(m); mark('mode='+m+'&via='+source);
}
/* pull-down + menu */
const pd=document.getElementById('pd');
pd.addEventListener('click',()=>{ if(S.menuOpen) return closeMenu(); openMenu(); });
function openMenu(){
  S.menuOpen=true; log('menu_open');
  const ph=document.getElementById('phone');
  const dim=document.createElement('div'); dim.className='dim'; dim.id='dim'; dim.addEventListener('click',closeMenu);
  const r=pd.getBoundingClientRect(), pr=ph.getBoundingClientRect();
  const menu=document.createElement('div'); menu.className='menu'; menu.id='menu'; menu.style.top=(r.bottom-pr.top+6)+'px'; menu.setAttribute('role','menu');
  menu.innerHTML = `<div class="mt">Choose function input</div>`+['fn','num'].map(m=>`<div class="mi" role="menuitemradio" aria-checked="${S.mode===m}" data-m="${m}"><span class="ck">${S.mode===m?'✓':''}</span><div class="tx"><div class="t1">${LABEL[m]}</div><div class="t2">${SUB[m]}</div></div></div>`).join('');
  menu.addEventListener('click',e=>{ const mi=e.target.closest('[data-m]'); if(!mi) return; setMode(mi.dataset.m,'menu'); closeMenu(); });
  ph.appendChild(dim); ph.appendChild(menu);
}
function closeMenu(){ S.menuOpen=false; ['dim','menu'].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); }); }

/* sheet */
function showSheet(){
  const ph=document.getElementById('phone'); let sel=S.presel;
  const scrim=document.createElement('div'); scrim.className='scrim'; scrim.id='scrim';
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  const title = S.variant==='returning' ? "What's New in Scientific Mode" : 'Welcome to Scientific Mode';
  const draw=()=>{ sh.innerHTML=`<div class="grab"></div><h2>${title}</h2><p>Choose how you type functions. Change it anytime next to Deg or in Settings.</p>
    <div class="list">${['fn','num'].map(m=>`<div class="li" data-m="${m}" role="radio" aria-checked="${sel===m}"><div class="ic${m==='num'?' n':''}">${m==='fn'?'ƒ(x)':'123'}</div><div class="tx"><div class="t1">${LABEL[m]}</div><div class="t2">${SUB[m]}</div></div><div class="ck">${sel===m?'✓':''}</div></div>`).join('')}</div>
    <button class="cta" id="cta">Continue</button>`; };
  draw();
  sh.addEventListener('click',e=>{ const li=e.target.closest('[data-m]'); if(li){ sel=li.dataset.m; draw(); log('sheet_select',{sel}); return; } if(e.target.id==='cta') finish('continue'); });
  const finish=(how)=>{ S.sheetShown=true; S.mode=sel; storeMode(sel); mark('sheet='+sel+'-'+how); sh.style.transform='translateY(100%)'; setTimeout(()=>{scrim.remove(); sh.remove();},250); paint(); log('sheet_done',{how, chosen:sel, preselected:S.presel}); };
  scrim.addEventListener('click',()=>finish('tap_outside'));            // dismiss = Continue
  let y0=null; sh.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;},{passive:true}); sh.addEventListener('touchend',e=>{ if(y0!==null && e.changedTouches[0].clientY-y0>60) finish('swipe'); y0=null; });
  sh.addEventListener('mousedown',e=>{y0=e.clientY;}); sh.addEventListener('mouseup',e=>{ if(y0!==null && e.clientY-y0>60) finish('swipe'); y0=null; });
  ph.appendChild(scrim); ph.appendChild(sh); log('sheet_shown',{variant:S.variant, preselected:S.presel});
}

/* settings */
document.getElementById('moreBtn').addEventListener('click',()=>openSettings('root'));
function openSettings(page){
  closeSettings(); S.settings=page; log('settings_open',{page});
  const ph=document.getElementById('phone'); const v=document.createElement('div'); v.className='settings'; v.id='settings';
  if(page==='root'){
    v.innerHTML=`<div class="nav"><span></span><b>Settings</b><span class="cl" id="sClose">Close</span></div>
      <div class="sgroup"><div class="srow only" style="pointer-events:none;color:#8E8E93">Choose Your Subscription Plan<span class="chev">›</span></div></div>
      <div class="sgroup">
        <div class="srow" style="pointer-events:none"><div>General Decimal Places<div class="sub">Default</div></div><span class="chev">›</span></div>
        <div class="srow" style="pointer-events:none"><div>Decimal Notation<div class="sub">1.234.567,89</div></div><span class="chev">›</span></div>
        <div class="srow" id="sFn"><div>Function Input<div class="sub">${LABEL[S.mode]}</div></div><span class="chev">›</span></div>
        <div class="srow" style="pointer-events:none"><div>Haptic Feedback</div><span class="chev">›</span></div>
      </div>`;
    v.querySelector('#sClose').onclick=closeSettings; v.querySelector('#sFn').onclick=()=>openSettings('detail');
  } else {
    v.innerHTML=`<div class="nav"><span class="bk" id="sBack">‹ Settings</span><b>Function Input</b><span style="width:70px"></span></div>
      <div class="sgroup">${['fn','num'].map(m=>`<div class="srow" data-m="${m}"><div>${LABEL[m]}<div class="sub">${SUB[m]}</div></div><span style="color:var(--blue);width:20px;text-align:center">${S.mode===m?'✓':''}</span></div>`).join('')}</div>
      <div class="hint">Applies to sin, cos, tan, ln, log and roots in the scientific calculator. Squares, powers and factorials always follow the number.</div>`;
    v.querySelector('#sBack').onclick=()=>openSettings('root');
    v.querySelectorAll('[data-m]').forEach(r=> r.onclick=()=>{ setMode(r.dataset.m,'settings'); openSettings('detail'); });
  }
  ph.appendChild(v);
}
function closeSettings(){ const e=document.getElementById('settings'); if(e) e.remove(); S.settings=null; }

/* URL params — one link per Maze mission (test plan v0.4, Appendix B)
   ?mode=fn|num     sets the mode and remembers it; absent → last-used mode (storage) → 'fn'
   ?sheet=0|1       show the one-time sheet (default 1; never in probe)
   ?variant=returning|new   sheet copy
   ?presel=fn|num   sheet preselection (default fn — the Remote Config candidate)
   ?probe=1         cold-probe diagnostic state: accepts both orders, renders as typed, pull-down hidden, writes #first=
   ?dev=0           hide the dev bar
   ?markq=1         write markers as query params instead of the hash (fallback if Maze ignores hashes) */
const Q = new URLSearchParams(location.search);
const P = { mode: Q.get('mode'), sheet: Q.get('sheet'), variant: Q.get('variant'), dev: Q.get('dev'), probe: Q.get('probe'), presel: Q.get('presel'), markq: Q.get('markq') };
const MARK_KEYS = ['start','first','res','n','mode','via','sheet'];
function storeMode(m){ try{ localStorage.setItem('tc_mode', m); }catch(e){} }
function storedMode(){ try{ const m=localStorage.getItem('tc_mode'); return (m==='fn'||m==='num')?m:null; }catch(e){ return null; } }
if(P.variant) S.variant=P.variant;
if(P.presel==='fn'||P.presel==='num') S.presel=P.presel;
if(P.mode==='fn'||P.mode==='num'){ S.def=P.mode; storeMode(P.mode); } else if(storedMode()) S.def=storedMode();
if(P.probe==='1'){ S.probe=true; S.def='fn'; document.getElementById('pd').style.display='none'; }
if(P.dev==='0'){ document.querySelector('.dev').style.display='none'; document.body.style.padding='0'; document.body.style.background='var(--phone)'; }
function mark(tag){ // Maze reads the URL for mission success. Hash by default; ?markq=1 → query params (same keys)
  try{
    if(P.markq==='1'){ const q=new URLSearchParams(location.search); MARK_KEYS.forEach(k=>q.delete(k)); new URLSearchParams(tag).forEach((v,k)=>q.set(k,v)); history.replaceState(null,'', location.pathname+'?'+q.toString()); }
    else history.replaceState(null,'', location.pathname+location.search+'#'+tag);
  }catch(e){}
}
/* dev bar */
document.getElementById('devReset').addEventListener('click',reset);
document.getElementById('devVariant').addEventListener('change',e=>{ S.variant=e.target.value; reset(); });
document.getElementById('devDefault').addEventListener('change',e=>{ S.presel=e.target.value; reset(); });
document.getElementById('devLog').addEventListener('click',()=>{ navigator.clipboard.writeText(JSON.stringify(S.log,null,1)).then(()=>toast('Log copied')); });
document.getElementById('devToggleLog').addEventListener('click',e=>{ const v=document.getElementById('logView'); v.hidden=!v.hidden; e.target.textContent=v.hidden?'Show log':'Hide log'; if(!v.hidden) v.textContent=S.log.map(x=>JSON.stringify(x)).join('\n'); });
function reset(){
  closeMenu(); closeSettings(); ['scrim','sheet'].forEach(id=>{const e=document.getElementById(id); if(e) e.remove();});
  Object.assign(S,{mode:S.def, sheetShown:false, expr:[], afterEq:false, lastResult:null, lastValid:0, history:[], log:[], bsCount:0, eqCount:0, first:null, menuOpen:false, settings:null});
  paint(); log('reset',{variant:S.variant, mode:S.def, presel:S.presel, probe:S.probe}); mark('mode='+S.mode);   // mission start: which mode this task really runs in
  if(!S.probe && P.sheet!=='0') showSheet(); else S.sheetShown=true;
}
document.addEventListener('keydown',e=>{ if(S.settings||document.getElementById('sheet')) return; const map={'Enter':'=','=':'=','Backspace':'⌫','Escape':'ac','*':'×','/':'÷','-':'−','+':'+','(':'(',')':')','.':',',',':','}; const k=map[e.key]||(/^[0-9]$/.test(e.key)?e.key:null); if(k){ e.preventDefault(); press(k);} });

document.getElementById('devVariant').value=S.variant; document.getElementById('devDefault').value=S.presel; buildKeys(); reset();
})();
</script>

</body></html>
